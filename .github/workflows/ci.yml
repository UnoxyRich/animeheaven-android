name: Android Phone CI & UI Tests

on:
  push:
    branches: [ main, netflix-ui, "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-release:
    name: Unit Tests & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses & install SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run JVM unit tests, compile Android UI tests & build R8 release APK
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleRelease -PcomposeCompilerReports=true

      - name: Upload Release APK & Compose reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeheaven-android-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/compose_compiler/

  android-phone-ui-tests:
    name: Real Android Phone Emulator UI Tests & Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests-and-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses & install SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build walkthrough APKs before booting the emulator
        run: |
          ./gradlew --no-parallel --max-workers=2 assembleDebug assembleDebugAndroidTest
          ./gradlew --stop
          jps -l | awk '/KotlinCompileDaemon/ { print $1 }' | xargs -r kill

      - name: Boot Pixel 6 Emulator (API 34) & capture walkthrough screenshots
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-ui-walkthrough.sh me.animeheaven.android

      - name: Upload Phone App Screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeheaven-android-screenshots
          path: screenshots/*.png

      - name: Upload UI Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeheaven-android-ui-tests
          path: ui-test-results/
